<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRO TYPE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div class="hud">
            <div class="hud-block">
                <span class="hud-label">score</span>
                <span class="hud-value" id="score">0</span>
            </div>
            <div class="hud-block">
                <span class="hud-label">level</span>
                <span class="hud-value" id="level">1</span>
            </div>
            <div class="hud-block">
                <span class="hud-label">combo</span>
                <span class="hud-value" id="combo">0</span>
            </div>
            <div class="hud-block">
                <span class="hud-label">lives</span>
                <span class="hud-value" id="lives">&#9829;&#9829;&#9829;</span>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div class="buffer" id="buffer">type the words on the asteroids</div>
    </div>

    <div class="overlay" id="start-screen">
        <div class="overlay-card">
            <div class="title">ASTRO <span class="accent">TYPE</span></div>
             <p class="subtitle">Asteroids are falling on your ship. Destroy them by typing their words before they hit.</p>
            
            <div class="difficulty-select">
                <span class="diff-label">Difficulty</span>
                <div class="diff-btns">
                    <button class="diff-btn" data-diff="easy">Easy</button>
                    <button class="diff-btn active" data-diff="medium">Medium</button>
                    <button class="diff-btn" data-diff="hard">Hard</button>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary">Launch</button>
            <p class="hint">or press any key</p>
        </div>
    </div>

    <div class="overlay" id="gameover-screen" hidden>
        <div class="overlay-card">
            <div class="title">GAME OVER</div>
            <div class="results-grid">
                <div>
                    <span class="r-label">Score</span>
                    <span class="r-value" id="final-score">0</span>
                </div>
                <div>
                    <span class="r-label">WPM</span>
                    <span class="r-value" id="final-wpm">0</span>
                </div>
                <div>
                    <span class="r-label">Accuracy</span>
                    <span class="r-value" id="final-acc">0%</span>
                </div>
                <div>
                    <span class="r-label">Level</span>
                    <span class="r-value" id="final-level">1</span>
                </div>
                <div>
                    <span class="r-label">Max Combo</span>
                    <span class="r-value" id="final-combo">0</span>
                </div>
